name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# The image is addressed by commit SHA everywhere below. `latest` is never
# built or deployed: a mutable tag makes a rollout unreproducible and a
# rollback ambiguous — "redeploy the previous tag" only means something if the
# tag still points at what it pointed at then.
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/server

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Test with pytest
      run: pytest

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Buildx
      uses: docker/setup-buildx-action@v3

    # Only a merge publishes. A pull request still builds, so a Dockerfile that
    # cannot build fails the PR rather than the deploy that follows it.
    - name: Log in to the container registry
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name == 'push' }}
        tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  stack:
    name: Integration tests against the Compose stack
    runs-on: ubuntu-latest
    needs: tests

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # A throwaway key for a throwaway stack. Compose refuses to start without
    # one, which is the point: a server that silently ran with no signing key
    # would pass CI and fail in a cluster.
    - name: Start the stack
      run: |
        echo "KFCHESS_TOKEN_SIGNING_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> .env
        docker compose up --build --detach --wait --wait-timeout 120

    - name: Probe the operational endpoints
      run: |
        curl --fail --silent --show-error http://localhost:8080/healthz
        curl --fail --silent --show-error http://localhost:8080/readyz
        curl --fail --silent --show-error http://localhost:8080/metrics | grep -q kfchess_

    - name: Run the integration suite against a real socket
      run: pytest tests/integration -q

    - name: Dump logs on failure
      if: failure()
      run: docker compose logs --no-color

    - name: Tear down
      if: always()
      run: docker compose down --volumes
