# Pytest configuration.
#
# Discovery is still pytest's default over `tests/`. What this file adds is the
# marker vocabulary that appeared once the server grew dependencies it cannot
# carry in-process.
#
# `pytest` with no containers running must stay green: every backend has an
# in-process implementation behind the same port, and the `infra` tests below
# skip themselves when the service they need is not configured. That is a skip,
# never a failure — a developer with no Docker daemon is not looking at a broken
# repository.

[pytest]
testpaths = tests
markers =
    infra: needs a real backing service (Redis, PostgreSQL, NATS). Skipped
        unless the matching KFCHESS_*_URL/DSN environment variable is set, which
        the Compose stack and CI both provide.

# Silences pytest-asyncio's warning about an unset default. Function scope is
# what the suite already assumes: every async test builds its own server, room
# or database and must not share a loop with the next one.
asyncio_default_fixture_loop_scope = function
