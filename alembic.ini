# Alembic configuration.
#
# The database URL is deliberately absent: it arrives from KFCHESS_POSTGRES_DSN
# at runtime (see migrations/env.py). A DSN committed here would either be wrong
# for every environment or, worse, right for one of them and carry its password.

[alembic]
script_location = migrations
prepend_sys_path = .

# Revision files are named with a UTC timestamp prefix so `ls` and the migration
# history agree on order, which matters when two branches each add one.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
